[project]
name = "signal-miner"
version = "0.1.0"
description = "Weekly ranked leads of newly funded startups from free public signals"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.3",
]

[project.optional-dependencies]
enrich = ["claude-agent-sdk==0.2.181"]

[dependency-groups]
dev = ["pytest==9.2.0", "respx==0.23.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_miner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
signal-miner = "signal_miner.cli:main"
