name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sm_admin
          POSTGRES_PASSWORD: sm_admin
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sm_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SM_TEST_ADMIN_DSN: postgresql://sm_admin:sm_admin@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: uv sync --extra enrich
      - run: uv run pytest
